# ============================================================
#  JAIN University – Spot Counselling 2026
#  nginx.conf  |  Nginx server block configuration
#  Domain: spotcounselling.jainuniversity.co.in
#
#  Usage:
#  1. Place SSL certificates from Let's Encrypt / your CA:
#       /etc/ssl/spotcounselling/fullchain.pem
#       /etc/ssl/spotcounselling/privkey.pem
#  2. Copy this file to /etc/nginx/sites-available/spotcounselling
#  3. ln -s /etc/nginx/sites-available/spotcounselling /etc/nginx/sites-enabled/
#  4. nginx -t && systemctl reload nginx
# ============================================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name spotcounselling.jainuniversity.co.in;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name spotcounselling.jainuniversity.co.in;

    # ── SSL Certificates ─────────────────────────────────
    # Use Let's Encrypt (free): sudo certbot --nginx -d spotcounselling.jainuniversity.co.in
    ssl_certificate     /etc/ssl/spotcounselling/fullchain.pem;
    ssl_certificate_key /etc/ssl/spotcounselling/privkey.pem;

    # ── SSL Security Settings ────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Document root ────────────────────────────────────
    root /var/www/spotcounselling;
    index index.html;

    # ── Security Headers ─────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Enable HSTS only after confirming SSL works correctly:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self'; style-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    server_tokens off;

    # ── Gzip ─────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml font/woff font/woff2;

    # ── Static file caching ───────────────────────────────
    location ~* \.(css|js|woff|woff2|ttf|otf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 14d;
        add_header Cache-Control "public";
        access_log off;
    }
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # ── Pretty URLs (/registration → /registration.html) ──
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # ── Block hidden/config files ─────────────────────────
    location ~ /\. { deny all; access_log off; log_not_found off; }
    location ~* \.(bak|config|sql|ini|log|sh|inc|swp)$ { deny all; }

    # ── Custom error pages ────────────────────────────────
    error_page 404 /404.html;
    error_page 500 502 503 504 /index.html;

    # ── Logging ───────────────────────────────────────────
    access_log /var/log/nginx/spotcounselling_access.log;
    error_log  /var/log/nginx/spotcounselling_error.log;
}
